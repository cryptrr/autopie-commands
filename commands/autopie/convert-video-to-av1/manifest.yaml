version: "1.0.0"
id: "autopie.convert-video-to-av1"
namespace: "autopie"
name: "Convert video to AV1"
commandSlug: "ffmpeg"
summary: "Transcode a video to AV1 in an MKV container using high-quality settings."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  path: ""
  command: 'ffmpeg -i "${INPUT_FILE}" -c:v libaom-av1 -crf 18 -b:v 0 "${INPUT_FILE}.mkv"'
install:
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
