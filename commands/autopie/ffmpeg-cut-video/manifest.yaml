schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.0"
id: "autopie.ffmpeg-cut-video"
namespace: "autopie"
name: "FFMPEG: Cut Video"
commandSlug: "ffmpeg"
summary: "Cut a video to a specified start time and optional duration using FFmpeg."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  type: "SHARE"
  path: "Download"
  command: 'ffmpeg -i "${INPUT_FILE}" -ss ${START} ${END:+-t $END} "${INPUT_FILE}-cut-${RAND}.mp4"'
  extras:
    - id: "368102"
      name: "START"
      type: "STRING"
      default: "00:00:00"
      description: "Start time"
      required: false
    - id: "218569"
      name: "END"
      type: "STRING"
      default: ""
      description: "End time "
      required: false
install:
  dependencies:
    pkg: ["ffmpeg"]
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
