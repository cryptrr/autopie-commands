schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.1"
id: "autopie.ffmpeg-cut-video"
namespace: "autopie"
name: "FFMPEG: Cut Video"
commandSlug: "ffmpeg"
summary: "Cut a video to a specified start time and end time using FFmpeg."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  type: "SHARE"
  path: "Download"
  command: 'ffmpeg -ss "${START:-00:00:00}" ${END:+-to "$END"} -i "${INPUT_FILE}" -c:v libx264 -c:a aac "${INPUT_FILE}-cut-${RAND}.mp4"'
  extras:
    - id: "368102"
      name: "START"
      type: "STRING"
      default: "00:00:00"
      description: "Start time"
      required: false
    - id: "218569"
      name: "END"
      type: "STRING"
      default: ""
      description: "End time "
      required: false
install:
  dependencies:
    pkg: ["ffmpeg"]
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
