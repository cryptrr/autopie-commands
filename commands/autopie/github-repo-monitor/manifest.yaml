schemaVersion: "2026.6.1"
addedAt: "2026-09-13T23:18:02Z"
updatedAt: "2026-09-13T23:18:02Z"
version: "1.0.0"
id: "autopie.github-repo-monitor"
namespace: "autopie"
name: "GitHub Repo Monitor"
commandSlug: ""
summary: "A 15-minute GitHub repository monitor cron designed for display as an Android widget."
kind: "MONITOR"
tags: ["python", "github", "cron", "widget"]
runtime:
  path: ""
  type: "CRON"
  cronInterval: "15m"
  command: |-
    #@PYTHON
    import os
    import json
    import urllib.request
    import urllib.parse
    from datetime import datetime

    repo = os.environ.get("REPO", "cryptrr/AutoPie").strip()
    token = os.environ.get("GITHUB_TOKEN", "").strip()

    headers = {
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "AutoPie-GitHub-Monitor"
    }

    if token:
        headers["Authorization"] = f"Bearer {token}"


    def get_json(url):
        req = urllib.request.Request(url, headers=headers)
        with urllib.request.urlopen(req, timeout=15) as response:
            return json.load(response)


    repo_data = get_json(f"https://api.github.com/repos/{repo}")

    issue_query = urllib.parse.quote(f"repo:{repo} is:issue is:open")
    pr_query = urllib.parse.quote(f"repo:{repo} is:pr is:open")

    issue_data = get_json(
        f"https://api.github.com/search/issues?q={issue_query}&per_page=1"
    )

    pr_data = get_json(
        f"https://api.github.com/search/issues?q={pr_query}&per_page=1"
    )

    runs_data = get_json(
        f"https://api.github.com/repos/{repo}/actions/runs?per_page=1"
    )

    runs = runs_data.get("workflow_runs", [])

    if runs:
        run = runs[0]
        ci = {
            "name": run.get("name"),
            "status": run.get("status"),
            "conclusion": run.get("conclusion"),
            "branch": run.get("head_branch"),
            "event": run.get("event")
        }
    else:
        ci = None

    result = {
        "repo": repo,
        "stars": repo_data.get("stargazers_count", 0),
        "forks": repo_data.get("forks_count", 0),
        "open_issues": issue_data.get("total_count", 0),
        "open_prs": pr_data.get("total_count", 0),
        "checked": datetime.now().strftime("%H:%M:%S"),
        "ci": ci
    }

    output = json.dumps(result, separators=(",", ":"))

    print(f'#@AUTOPIE {{"type":"output","value":{output}}}')

    os.environ["OUTPUT"] = output
  extras:
    - id: "repo"
      name: "REPO"
      type: "STRING"
      default: ""
      defaultBoolean: true
      description: "GitHub repository in owner/repo format"
      required: true
      flags: ["--internal-config"]
    - id: "github_token"
      name: "GITHUB_TOKEN"
      type: "STRING"
      default: ""
      defaultBoolean: true
      description: "Optional GitHub token for higher API limits and private repositories"
      required: true
      flags: ["--secret", "--internal-config"]
install:
  primaryPackage: "python"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
uninstall:
  script: "uninstall.sh"
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
