schemaVersion: "2026.6.1"
version: "1.0.1"
id: "autopie.share-file-folder-lan"
namespace: "autopie"
name: "Share file/folder over LAN"
commandSlug: "share"
summary: "Temporarily share a file or folder over the local network with an expiring HTTP link."
type: "PACKAGE"
tags: ["python", "network", "sharing"]
runtime:
  path: ""
  type: "SHARE"
  command: "#@PYTHON\nimport functools\nimport http.server\nimport os\nimport re\nimport shutil\nimport signal\nimport socket\nimport subprocess\nimport tempfile\nimport time\nfrom pathlib import Path\nfrom urllib.parse import quote\n\n\ndef die(message):\n    print(f\"Error: {message}\", flush=True)\n    raise SystemExit(1)\n\n\ndef command_output(*args):\n    try:\n        return subprocess.check_output(\n            args,\n            text=True,\n            stderr=subprocess.DEVNULL,\n            timeout=2,\n        ).strip()\n    except Exception:\n        return \"\"\n\n\ndef get_lan_ip():\n    # Prefer actual LAN interfaces so VPN/cellular routes don't win.\n    for iface in (\"wlan0\", \"wlan1\", \"eth0\"):\n        text = command_output(\n            \"ip\", \"-4\", \"-o\", \"addr\", \"show\", \"dev\", iface\n        )\n        match = re.search(r\"\\binet\\s+(\\d+\\.\\d+\\.\\d+\\.\\d+)/\", text)\n        if match:\n            return match.group(1)\n\n    # Routing-table fallback.\n    text = command_output(\"ip\", \"-4\", \"route\", \"get\", \"1.1.1.1\")\n    match = re.search(r\"\\bsrc\\s+(\\d+\\.\\d+\\.\\d+\\.\\d+)\", text)\n    if match:\n        return match.group(1)\n\n    # Socket fallback.\n    for remote in (\"192.0.2.1\", \"1.1.1.1\", \"8.8.8.8\"):\n        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n        try:\n            sock.connect((remote, 80))\n            ip = sock.getsockname()[0]\n            if ip and not ip.startswith(\"127.\"):\n                return ip\n        except OSError:\n            pass\n        finally:\n            sock.close()\n\n    return None\n\n\ndef normalize_lan_hostname(value):\n    value = (value or \"\").strip().lower().rstrip(\".\")\n\n    if not value or value in {\n        \"localhost\",\n        \"localhost.localdomain\",\n        \"(none)\",\n        \"null\",\n    }:\n        return None\n\n    if value.endswith(\".lan\"):\n        value = value[:-4]\n\n    value = re.sub(r\"[^a-z0-9.-]+\", \"-\", value)\n    value = re.sub(r\"-+\", \"-\", value).strip(\"-.\")\n\n    if not value:\n        return None\n\n    return f\"{value}.lan\"\n\n\ndef resolves_to(host, ip):\n    try:\n        addresses = {\n            item[4][0]\n            for item in socket.getaddrinfo(\n                host,\n                None,\n                socket.AF_INET,\n            )\n        }\n        return ip in addresses\n    except OSError:\n        return False\n\n\ndef find_lan_hostname(ip):\n    candidates = []\n\n    # OpenWrt/dnsmasq PTR record is the preferred source.\n    try:\n        candidates.append(socket.gethostbyaddr(ip)[0])\n    except OSError:\n        pass\n\n    candidates.extend([\n        command_output(\"getprop\", \"net.hostname\"),\n        command_output(\"hostname\"),\n        command_output(\"getprop\", \"persist.sys.device_name\"),\n        command_output(\"settings\", \"get\", \"global\", \"device_name\"),\n        socket.gethostname(),\n    ])\n\n    seen = set()\n\n    for candidate in candidates:\n        hostname = normalize_lan_hostname(candidate)\n\n        if not hostname or hostname in seen:\n            continue\n\n        seen.add(hostname)\n\n        # Don't publish a hostname that doesn't resolve to this phone.\n        if resolves_to(hostname, ip):\n            return hostname\n\n    return None\n\n\n# ---------------------------------------------------------------------\n# Input\n# ---------------------------------------------------------------------\n\ntarget_value = os.environ.get(\"INPUT\", \"\").strip()\nif not target_value:\n    die(\"No file or folder received\")\n\ntarget = Path(target_value)\nif not target.exists():\n    die(f\"Input does not exist: {target}\")\n\ntry:\n    expiry_seconds = int(os.environ.get(\"EXPIRY\", \"300\"))\nexcept ValueError:\n    die(\"Invalid expiry\")\n\nif expiry_seconds <= 0:\n    die(\"Expiry must be greater than zero\")\n\nurl_mode = os.environ.get(\"URL_MODE\", \"hostname\").strip().lower()\n\n\n# ---------------------------------------------------------------------\n# Network\n# ---------------------------------------------------------------------\n\nlan_ip = get_lan_ip()\nif not lan_ip:\n    die(\"Could not determine LAN IPv4 address\")\n\nhostname = None\n\nif url_mode == \"hostname\":\n    hostname = find_lan_hostname(lan_ip)\n\n    if hostname:\n        url_host = hostname\n    else:\n        print(\"Hostname unavailable; falling back to IP\", flush=True)\n        url_host = lan_ip\nelse:\n    url_host = lan_ip\n\n\n# ---------------------------------------------------------------------\n# Isolated share root\n# ---------------------------------------------------------------------\n\nstate_dir = Path.home() / \".cache\" / \"autopie-lan-share\"\nstate_dir.mkdir(parents=True, exist_ok=True)\n\nshare_root = Path(\n    tempfile.mkdtemp(\n        prefix=\"share-\",\n        dir=state_dir,\n    )\n)\n\nname = target.name or \"shared\"\nshare_path = share_root / name\n\ntry:\n    share_path.symlink_to(\n        target.resolve(),\n        target_is_directory=target.is_dir(),\n    )\nexcept Exception as exc:\n    shutil.rmtree(share_root, ignore_errors=True)\n    die(f\"Could not prepare share: {exc}\")\n\n\n# ---------------------------------------------------------------------\n# HTTP handler with byte-range support\n# ---------------------------------------------------------------------\n\nclass RangeRequestHandler(http.server.SimpleHTTPRequestHandler):\n    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, fmt, *args):\n        print(\n            f\"[{self.client_address[0]}] {fmt % args}\",\n            flush=True,\n        )\n\n    def send_head(self):\n        path = self.translate_path(self.path)\n\n        # Let SimpleHTTPRequestHandler handle directories, redirects,\n        # directory listings and errors normally.\n        if not os.path.isfile(path):\n            return super().send_head()\n\n        try:\n            file = open(path, \"rb\")\n        except OSError:\n            self.send_error(404, \"File not found\")\n            return None\n\n        try:\n            stat = os.fstat(file.fileno())\n            size = stat.st_size\n            content_type = self.guess_type(path)\n\n            range_header = self.headers.get(\"Range\")\n            start = 0\n            end = size - 1\n            partial = False\n\n            if range_header:\n                match = re.fullmatch(\n                    r\"bytes=(\\d*)-(\\d*)\",\n                    range_header.strip(),\n                )\n\n                if not match:\n                    file.close()\n                    self.send_error(416, \"Invalid Range\")\n                    return None\n\n                start_text, end_text = match.groups()\n\n                if not start_text and not end_text:\n                    file.close()\n                    self.send_error(416, \"Invalid Range\")\n                    return None\n\n                if start_text:\n                    start = int(start_text)\n\n                    if end_text:\n                        end = int(end_text)\n                    else:\n                        end = size - 1\n                else:\n                    # Suffix range: bytes=-500\n                    suffix_length = int(end_text)\n\n                    if suffix_length <= 0:\n                        file.close()\n                        self.send_error(416, \"Invalid Range\")\n                        return None\n\n                    suffix_length = min(suffix_length, size)\n                    start = size - suffix_length\n                    end = size - 1\n\n                if start >= size or start < 0 or end < start:\n                    file.close()\n                    self.send_response(416)\n                    self.send_header(\"Content-Range\", f\"bytes */{size}\")\n                    self.send_header(\"Content-Length\", \"0\")\n                    self.end_headers()\n                    return None\n\n                end = min(end, size - 1)\n                partial = True\n\n            self._range_start = start\n            self._range_end = end\n\n            if partial:\n                self.send_response(206)\n                self.send_header(\n                    \"Content-Range\",\n                    f\"bytes {start}-{end}/{size}\",\n                )\n                content_length = end - start + 1\n            else:\n                self.send_response(200)\n                content_length = size\n\n            self.send_header(\"Content-Type\", content_type)\n            self.send_header(\"Content-Length\", str(content_length))\n            self.send_header(\"Accept-Ranges\", \"bytes\")\n            self.send_header(\n                \"Last-Modified\",\n                self.date_time_string(stat.st_mtime),\n            )\n            self.end_headers()\n\n            file.seek(start)\n            return file\n\n        except Exception:\n            file.close()\n            raise\n\n    def copyfile(self, source, outputfile):\n        start = getattr(self, \"_range_start\", 0)\n        end = getattr(self, \"_range_end\", None)\n\n        if end is None:\n            return super().copyfile(source, outputfile)\n\n        remaining = end - start + 1\n        buffer_size = 1024 * 1024\n\n        while remaining > 0:\n            chunk = source.read(min(buffer_size, remaining))\n\n            if not chunk:\n                break\n\n            try:\n                outputfile.write(chunk)\n            except (BrokenPipeError, ConnectionResetError):\n                # Normal when mpv/VLC closes a probe/range request early.\n                break\n\n            remaining -= len(chunk)\n\n\nclass LANServer(http.server.ThreadingHTTPServer):\n    daemon_threads = True\n    allow_reuse_address = True\n\n\nhandler = functools.partial(\n    RangeRequestHandler,\n    directory=str(share_root),\n)\n\ntry:\n    # Port 0 asks the kernel to assign a free port atomically.\n    server = LANServer((lan_ip, 0), handler)\nexcept OSError as exc:\n    shutil.rmtree(share_root, ignore_errors=True)\n    die(f\"Could not start LAN server: {exc}\")\n\nport = server.server_address[1]\n\n\n# ---------------------------------------------------------------------\n# URL\n# ---------------------------------------------------------------------\n\nurl = f\"http://{url_host}:{port}/{quote(name, safe='')}\"\n\nif target.is_dir():\n    url += \"/\"\n\nprint(f\"Sharing: {target}\", flush=True)\nprint(f\"URL: {url}\", flush=True)\nprint(f\"LAN IP: {lan_ip}\", flush=True)\n\nif hostname:\n    print(f\"Hostname: {hostname}\", flush=True)\n\nprint(f\"Expires in: {expiry_seconds // 60} minute(s)\", flush=True)\nprint(\"Server running...\", flush=True)\n\n\n# ---------------------------------------------------------------------\n# Android share sheet\n# ---------------------------------------------------------------------\n\nsubprocess.run(\n    [\n        \"am\",\n        \"start\",\n        \"-a\",\n        \"android.intent.action.SEND\",\n        \"-t\",\n        \"text/plain\",\n        \"--es\",\n        \"android.intent.extra.TEXT\",\n        url,\n    ],\n    stdout=subprocess.DEVNULL,\n    stderr=subprocess.DEVNULL,\n    check=False,\n)\n\n\n# ---------------------------------------------------------------------\n# Keep this AutoPie command alive until expiry / cancellation\n# ---------------------------------------------------------------------\n\nserver.timeout = 1.0\nexpires_at = time.monotonic() + expiry_seconds\nstopping = False\n\n\ndef stop_server(signum=None, frame=None):\n    global stopping\n    stopping = True\n\n\nsignal.signal(signal.SIGTERM, stop_server)\nsignal.signal(signal.SIGINT, stop_server)\n\ntry:\n    while not stopping and time.monotonic() < expires_at:\n        server.handle_request()\nfinally:\n    server.server_close()\n    shutil.rmtree(share_root, ignore_errors=True)\n\nprint(\"LAN share stopped\", flush=True)\n"
  flags: ["--show-loading-screen-small"]
  extras:
    - id: "expiry"
      name: "EXPIRY"
      type: "SELECTABLE"
      default: "300"
      description: "How long the LAN link should remain active."
      required: true
      selectableOptions:
        {
          "5 minutes": "300",
          "15 minutes": "900",
          "30 minutes": "1800",
          "1 hour": "3600",
          "2 hours": "7200",
          "4 hours": "14400",
          "12 hours": "43200",
          "24 hours": "86400",
        }
    - id: "url_mode"
      name: "URL_MODE"
      type: "SELECTABLE"
      default: "hostname"
      description: "Choose the address used in the shared link."
      required: true
      selectableOptions: { "Hostname (.lan)": "hostname", "IP address": "ip" }
install:
  primaryPackage: "python"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
uninstall:
  script: "uninstall.sh"
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
