schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.0"
id: "autopie.combine-gifs-vertically"
namespace: "autopie"
name: "Combine Gifs Vertically"
commandSlug: "magick"
summary: "Resize and stack multiple GIFs vertically into a single animated GIF."
kind: "APP"
tags: ["imagemagick"]
runtime:
  type: "SHARE"
  path: ""
  command: 'magick "${INPUT_FILES_ARR[@]}" -resize ${QUALITY}x -append "${INPUT_FILE}.vert.gif"'
  extras:
    - id: "280847"
      name: "QUALITY"
      type: "SELECTABLE"
      default: "720x"
      description: ""
      required: false
      selectableOptions: ["720x", "480x", "1080x"]
install:
  dependencies:
    pkg: ["imagemagick"]
  primaryPackage: "imagemagick"
  extraPackages: []
  installerVersion: 1
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
