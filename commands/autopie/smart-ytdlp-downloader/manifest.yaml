schemaVersion: "2026.6.1"
version: "1.0.2"
id: "autopie.smart-ytdlp-downloader"
namespace: "autopie"
name: "Smart YT-DLP Downloader"
commandSlug: "yt-dlp"
summary: "Inspect a shared media URL, then download video, audio, subtitles, or a selected clip."
type: "PACKAGE"
tags: ["yt-dlp", "ffmpeg", "media"]
runtime:
  multiStage: true
  type: "SHARE"
  flags: ["--show-loading-screen-small"]
  steps:
    - id: "inspect"
      path: "Download"
      command: |-
        set -euo pipefail

        command -v yt-dlp >/dev/null 2>&1 || {
          echo "yt-dlp is not installed. Run: pip install -U yt-dlp"
          exit 1
        }

        command -v ffmpeg >/dev/null 2>&1 || {
          echo "ffmpeg is not installed. Run: pkg install ffmpeg"
          exit 1
        }

        export SOURCE_URL="$INPUT_URL"
        export WORK_ROOT="$HOME/.cache/autopie-smart-ytdlp-$RAND"
        mkdir -p "$WORK_ROOT"

        COOKIE_ARGS=()

        if [[ -n "${USE_COOKIE_JAR:-}" ]]; then
          COOKIE_ARGS=(--cookies "$COOKIE_JAR")
        fi

        INFO_JSON="$WORK_ROOT/info.json"

        yt-dlp \
          --ignore-config \
          "${COOKIE_ARGS[@]}" \
          --dump-single-json \
          --no-playlist \
          --no-warnings \
          "$SOURCE_URL" > "$INFO_JSON"

        eval "$(
        python - "$INFO_JSON" <<'PYINFO'
        import json
        import math
        import re
        import shlex
        import sys

        path = sys.argv[1]
        with open(path, "r", encoding="utf-8") as f:
            info = json.load(f)

        def clean(value, fallback="Unknown"):
            value = str(value or fallback)
            value = value.replace("\n", " ").replace("\r", " ")
            value = re.sub(r"\s+", " ", value).strip()
            return value or fallback

        def option_label(value):
            return clean(value).replace(",", " ").replace("=", "-")

        def safe_code(value):
            value = str(value or "")
            return value if re.fullmatch(r"[A-Za-z0-9._-]+", value) else ""

        def export(name, value):
            print(f"export {name}={shlex.quote(str(value))}")

        title = clean(info.get("title"), "Untitled media")
        uploader = clean(
            info.get("uploader")
            or info.get("channel")
            or info.get("creator"),
            "Unknown uploader"
        )
        source = clean(
            info.get("extractor_key")
            or info.get("extractor")
            or info.get("webpage_url_domain"),
            "Unknown source"
        )

        duration_raw = info.get("duration") or 0
        try:
            duration = max(0.0, float(duration_raw))
        except (TypeError, ValueError):
            duration = 0.0

        if duration:
            total = int(round(duration))
            h, rem = divmod(total, 3600)
            m, s = divmod(rem, 60)
            duration_text = f"{h}:{m:02d}:{s:02d}" if h else f"{m}:{s:02d}"
        else:
            duration_text = "Live / unknown"

        formats = info.get("formats") or []
        heights = []

        for fmt in formats:
            if fmt.get("vcodec") in (None, "none"):
                continue

            try:
                height = int(fmt.get("height") or 0)
            except (TypeError, ValueError):
                height = 0

            if height > 0:
                heights.append(height)

        max_height = max(heights, default=0)
        max_height_text = f"{max_height}p" if max_height else "Unknown"

        quality = [("Best available", "best")]

        for height, label in [
            (4320, "Up to 4320p (8K)"),
            (2160, "Up to 2160p (4K)"),
            (1440, "Up to 1440p"),
            (1080, "Up to 1080p"),
            (720, "Up to 720p"),
            (480, "Up to 480p"),
            (360, "Up to 360p")
        ]:
            if max_height >= height:
                quality.append((label, str(height)))

        quality_options = ",".join(
            f"{option_label(label)}={value}"
            for label, value in quality
        )

        if max_height >= 1080:
            quality_default = "1080"
        elif max_height >= 720:
            quality_default = "720"
        elif max_height >= 480:
            quality_default = "480"
        else:
            quality_default = "best"

        subtitle_options = [("None", "none")]
        manual = info.get("subtitles") or {}
        automatic = info.get("automatic_captions") or {}

        def subtitle_name(code, entries):
            if isinstance(entries, list):
                for entry in entries:
                    if isinstance(entry, dict) and entry.get("name"):
                        return clean(entry["name"], code)
            return code

        def language_priority(code):
            lowered = code.lower()
            if lowered == "en":
                return (0, lowered)
            if lowered.startswith("en-"):
                return (1, lowered)
            return (2, lowered)

        for raw_code in sorted(manual.keys(), key=language_priority):
            code = safe_code(raw_code)
            if not code or code == "live_chat":
                continue

            label = subtitle_name(code, manual.get(raw_code))
            subtitle_options.append(
                (f"{label} [{code}] - manual", f"manual|{code}")
            )

        auto_codes = [
            code
            for code in sorted(automatic.keys(), key=language_priority)
            if code not in manual
        ]

        for raw_code in auto_codes[:30]:
            code = safe_code(raw_code)
            if not code or code == "live_chat":
                continue

            label = subtitle_name(code, automatic.get(raw_code))
            subtitle_options.append(
                (f"{label} [{code}] - auto", f"auto|{code}")
            )

        subtitle_options_value = ",".join(
            f"{option_label(label)}={value}"
            for label, value in subtitle_options
        )

        if duration >= 2:
            duration_seconds = max(2, int(math.ceil(duration)))
            clip_options = "Full media=full,Choose a clip=clip"
            trim_start_range = f"0,0,{duration_seconds}"
            trim_end_range = f"0,{duration_seconds},{duration_seconds}"
        else:
            clip_options = "Full media=full"
            trim_start_range = "0,0,1"
            trim_end_range = "0,1,1"

        export("MEDIA_TITLE", title)
        export("MEDIA_UPLOADER", uploader)
        export("MEDIA_SOURCE", source)
        export("MEDIA_DURATION_TEXT", duration_text)
        export("MEDIA_MAX_HEIGHT_TEXT", max_height_text)
        export("QUALITY_OPTIONS", quality_options)
        export("QUALITY_DEFAULT", quality_default)
        export("SUBTITLE_OPTIONS", subtitle_options_value)
        export("CLIP_OPTIONS", clip_options)
        export("TRIM_START_RANGE", trim_start_range)
        export("TRIM_END_RANGE", trim_end_range)
        PYINFO
        )"

        printf 'Found: %s\nUploader: %s\nSource: %s\nDuration: %s\nMax video: %s\n' \
          "$MEDIA_TITLE" \
          "$MEDIA_UPLOADER" \
          "$MEDIA_SOURCE" \
          "$MEDIA_DURATION_TEXT" \
          "$MEDIA_MAX_HEIGHT_TEXT"
      extras:
        - id: "use_cookie_jar"
          name: "USE_COOKIE_JAR"
          type: "FLAG"
          default: "false"
          defaultBoolean: false
          description: "Use AutoPie's browser cookie jar for inspection and download."
    - id: "download"
      path: "Download"
      command: |-
        set -euo pipefail

        mkdir -p "$OUTPUT_FOLDER"

        COMMON_ARGS=(
          --ignore-config
          --no-playlist
          --no-overwrites
          --newline
          --no-simulate
          -o "$OUTPUT_FOLDER/%(title).180B [%(id)s].%(ext)s"
        )

        FORMAT_ARGS=()

        if [[ "$DOWNLOAD_TYPE" == "video" ]]; then
          if [[ "$QUALITY" == "best" ]]; then
            case "$VIDEO_CONTAINER" in
              mp4)
                FORMAT_SELECTOR='bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best'
                ;;
              webm)
                FORMAT_SELECTOR='bestvideo[ext=webm]+bestaudio[ext=webm]/bestvideo+bestaudio/best'
                ;;
              mkv)
                FORMAT_SELECTOR='bestvideo+bestaudio/best'
                ;;
              *)
                echo "Unsupported video container: $VIDEO_CONTAINER"
                exit 1
                ;;
            esac
          else
            case "$VIDEO_CONTAINER" in
              mp4)
                FORMAT_SELECTOR="bestvideo[ext=mp4][height<=$QUALITY]+bestaudio[ext=m4a]/bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]"
                ;;
              webm)
                FORMAT_SELECTOR="bestvideo[ext=webm][height<=$QUALITY]+bestaudio[ext=webm]/bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]"
                ;;
              mkv)
                FORMAT_SELECTOR="bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]"
                ;;
              *)
                echo "Unsupported video container: $VIDEO_CONTAINER"
                exit 1
                ;;
            esac
          fi

          FORMAT_ARGS=(
            -f "$FORMAT_SELECTOR"
            --merge-output-format "$VIDEO_CONTAINER"
          )
        else
          FORMAT_ARGS=(
            -f "bestaudio/best"
            -x
            --audio-format "$AUDIO_FORMAT"
          )

          if [[ "$AUDIO_FORMAT" != "flac" ]]; then
            FORMAT_ARGS+=(--audio-quality "$AUDIO_QUALITY")
          fi
        fi

        SUBTITLE_ARGS=()

        if [[ "$DOWNLOAD_TYPE" == "video" && "$SUBTITLE_CHOICE" != "none" ]]; then
          SUB_KIND="${SUBTITLE_CHOICE%%|*}"
          SUB_LANG="${SUBTITLE_CHOICE#*|}"

          if [[ "$SUB_KIND" == "manual" ]]; then
            SUBTITLE_ARGS=(
              --write-subs
              --sub-langs "$SUB_LANG"
              --sub-format "srt/best"
              --embed-subs
            )
          elif [[ "$SUB_KIND" == "auto" ]]; then
            SUBTITLE_ARGS=(
              --write-auto-subs
              --sub-langs "$SUB_LANG"
              --sub-format "srt/best"
              --embed-subs
            )
          fi
        fi

        CLIP_ARGS=()

        if [[ "$CLIP_MODE" == "clip" ]]; then
          if (( CLIP_END <= CLIP_START )); then
            echo "Clip End must be greater than Clip Start."
            exit 1
          fi

          CLIP_ARGS=(
            --download-sections "*${CLIP_START}-${CLIP_END}"
          )
        fi

        POST_ARGS=()

        if [[ -n "$EMBED_METADATA" ]]; then
          POST_ARGS+=("$EMBED_METADATA")
        fi

        if [[ -n "$EMBED_THUMBNAIL" ]]; then
          POST_ARGS+=("$EMBED_THUMBNAIL")
        fi

        if [[ -n "$EMBED_CHAPTERS" ]]; then
          POST_ARGS+=("$EMBED_CHAPTERS")
        fi

        if [[ -n "$REMOVE_SPONSORS" ]]; then
          POST_ARGS+=(--sponsorblock-remove "$REMOVE_SPONSORS")
        fi

        PATH_FILE="$WORK_ROOT/final-path.txt"
        rm -f -- "$PATH_FILE"

        yt-dlp \
          "${COMMON_ARGS[@]}" \
          "${COOKIE_ARGS[@]}" \
          "${FORMAT_ARGS[@]}" \
          "${SUBTITLE_ARGS[@]}" \
          "${CLIP_ARGS[@]}" \
          "${POST_ARGS[@]}" \
          --print-to-file "after_move:filepath" "$PATH_FILE" \
          "$SOURCE_URL"

        [[ -s "$PATH_FILE" ]] || {
          echo "Download completed but the output path could not be determined."
          exit 1
        }

        DOWNLOADED_FILE="$(tail -n 1 "$PATH_FILE")"

        [[ -f "$DOWNLOADED_FILE" ]] || {
          echo "Downloaded file not found: $DOWNLOADED_FILE"
          exit 1
        }

        export OUTPUT="$DOWNLOADED_FILE"

        printf 'Downloaded successfully\nTitle: %s\nUploader: %s\nSaved: %s\n' \
          "$MEDIA_TITLE" \
          "$MEDIA_UPLOADER" \
          "$OUTPUT"

        rm -rf -- "$WORK_ROOT"
      extras:
        - id: "output_folder"
          name: "OUTPUT_FOLDER"
          type: "STRING"
          default: "Download"
          description: "Folder where the downloaded media will be saved."
          flags: ["--internal-config", "--folder-picker"]
        - id: "download_type"
          name: "DOWNLOAD_TYPE"
          type: "SELECTABLE"
          default: "video"
          description: "Download as video or extract audio only."
          selectableOptions: { "Video": "video", "Audio only": "audio" }
        - id: "quality"
          name: "QUALITY"
          type: "SELECTABLE"
          default: "$$QUALITY_DEFAULT"
          description: "Resolution choices are generated from the inspected media."
          selectableOptions: { "Available resolutions": "$$QUALITY_OPTIONS" }
          visibleWhen: { "extraId": "download_type", "equals": "video" }
        - id: "video_container"
          name: "VIDEO_CONTAINER"
          type: "SELECTABLE"
          default: "mp4"
          description: "MP4 gives the widest compatibility. MKV accepts almost any source streams."
          selectableOptions: { "MP4": "mp4", "MKV": "mkv", "WebM": "webm" }
          visibleWhen: { "extraId": "download_type", "equals": "video" }
        - id: "audio_format"
          name: "AUDIO_FORMAT"
          type: "SELECTABLE"
          default: "mp3"
          description: "Output format for audio-only downloads."
          selectableOptions:
            { "MP3": "mp3", "M4A / AAC": "m4a", "Opus": "opus", "FLAC": "flac" }
          visibleWhen: { "extraId": "download_type", "equals": "audio" }
        - id: "audio_quality"
          name: "AUDIO_QUALITY"
          type: "SELECTABLE"
          default: "192K"
          description: "Target bitrate for lossy audio formats."
          selectableOptions:
            { "128 kbps": "128K", "192 kbps": "192K", "320 kbps": "320K" }
          visibleWhen:
            {
              "all":
                [
                  { "extraId": "download_type", "equals": "audio" },
                  { "extraId": "audio_format", "notEquals": "flac" },
                ],
            }
        - id: "subtitle_choice"
          name: "SUBTITLE_CHOICE"
          type: "SELECTABLE"
          default: "none"
          description: "Manual and automatic subtitle languages are discovered from the URL."
          selectableOptions: { "Available subtitles": "$$SUBTITLE_OPTIONS" }
          visibleWhen: { "extraId": "download_type", "equals": "video" }
        - id: "clip_mode"
          name: "CLIP_MODE"
          type: "SELECTABLE"
          default: "full"
          description: "Download the full media or only a selected section."
          selectableOptions: { "Available clip modes": "$$CLIP_OPTIONS" }
        - id: "clip_start"
          name: "CLIP_START"
          type: "SLIDER"
          default: "$$TRIM_START_RANGE"
          description: "Clip start position in seconds."
          flags: ["--int", "--large"]
          visibleWhen: { "extraId": "clip_mode", "equals": "clip" }
        - id: "clip_end"
          name: "CLIP_END"
          type: "SLIDER"
          default: "$$TRIM_END_RANGE"
          description: "Clip end position in seconds."
          flags: ["--int", "--large"]
          visibleWhen: { "extraId": "clip_mode", "equals": "clip" }
        - id: "embed_metadata"
          name: "EMBED_METADATA"
          type: "FLAG"
          default: "--embed-metadata"
          description: "Embed title, uploader and other available metadata."
        - id: "embed_thumbnail"
          name: "EMBED_THUMBNAIL"
          type: "FLAG"
          default: "--embed-thumbnail"
          description: "Embed the source thumbnail as cover art when supported."
        - id: "embed_chapters"
          name: "EMBED_CHAPTERS"
          type: "FLAG"
          default: "--embed-chapters"
          description: "Preserve chapter markers when the source provides them."
          visibleWhen: { "extraId": "download_type", "equals": "video" }
        - id: "remove_sponsors"
          name: "REMOVE_SPONSORS"
          type: "FLAG"
          default: "default"
          description: "Remove SponsorBlock segments on supported sites."
install:
  primaryPackage: "yt-dlp"
  extraPackages: ["ffmpeg"]
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
uninstall:
  script: "uninstall.sh"
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
