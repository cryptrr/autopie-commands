schemaVersion: "2026.6.1"
addedAt: "2026-09-14T00:14:38Z"
updatedAt: "2026-09-14T00:25:39Z"
version: "1.0.0"
id: "autopie.health-check-widget"
namespace: "autopie"
name: "Health Check Widget"
commandSlug: ""
summary: "A widget that checks a URL every 15 minutes and reports its health and response timings."
kind: "MONITOR"
tags: ["curl", "python", "cron", "widget", "monitoring"]
runtime:
  path: ""
  type: "CRON"
  cronInterval: "15m"
  command: |-
    RESPONSE_FILE="$HOME/.cache/autopie-health-response.txt"
    mkdir -p "$(dirname "$RESPONSE_FILE")"

    METRICS="$(
      curl -sS \
        -o "$RESPONSE_FILE" \
        -w '%{http_code}|%{time_total}|%{time_connect}|%{time_starttransfer}|%{size_download}' \
        --max-time 10 \
        "$URL"
    )"
    CURL_STATUS=$?

    IFS='|' read -r HTTP_CODE TIME_TOTAL TIME_CONNECT TIME_TTFB SIZE_DOWNLOAD <<< "$METRICS"

    if [[ "$CURL_STATUS" -ne 0 ]]; then
      HTTP_CODE="000"
    fi

    LATENCY_MS=$(awk "BEGIN {printf \"%.0f\", ${TIME_TOTAL:-0} * 1000}")
    CONNECT_MS=$(awk "BEGIN {printf \"%.0f\", ${TIME_CONNECT:-0} * 1000}")
    TTFB_MS=$(awk "BEGIN {printf \"%.0f\", ${TIME_TTFB:-0} * 1000}")
    CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')

    if [[ "$HTTP_CODE" == "200" ]]; then
      STATUS="healthy"
    else
      STATUS="unhealthy"
    fi

    RESPONSE=""
    if [[ "$HTTP_CODE" != "200" ]]; then
      RESPONSE="$(cat "$RESPONSE_FILE" 2>/dev/null || true)"
    fi

    OUTPUT="$(
      STATUS="$STATUS" \
      HTTP_CODE="$HTTP_CODE" \
      LATENCY_MS="$LATENCY_MS" \
      CONNECT_MS="$CONNECT_MS" \
      TTFB_MS="$TTFB_MS" \
      CURRENT_TIME="$CURRENT_TIME" \
      RESPONSE="$RESPONSE" \
      python -c '
    import json, os

    print(json.dumps({
        "status": os.environ["STATUS"],
        "status_code": int(os.environ["HTTP_CODE"]) if os.environ["HTTP_CODE"].isdigit() else 0,
        "latency_ms": int(os.environ["LATENCY_MS"]),
        "connect_ms": int(os.environ["CONNECT_MS"]),
        "ttfb_ms": int(os.environ["TTFB_MS"]),
        "current_time": os.environ["CURRENT_TIME"],
        "response": os.environ["RESPONSE"] or None
    }, separators=(",", ":")))
    '
    )"

    export OUTPUT
    printf '%s\n' "$OUTPUT"
  extras:
    - id: "extra-url"
      name: "URL"
      type: "STRING"
      default: ""
      defaultBoolean: true
      description: "The URL to check health."
      required: true
      flags: ["--internal-config"]
install:
  dependencies:
    pkg: ["curl", "gawk", "python"]
  primaryPackage: "curl"
  extraPackages: ["gawk", "python"]
  installerVersion: 1
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
