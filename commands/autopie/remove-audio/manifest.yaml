id: "autopie.remove-audio"
namespace: "autopie"
name: "Remove Audio"
commandSlug: "ffmpeg"
summary: "Remove all audio streams from a video without re-encoding the video."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  path: ""
  command: 'ffmpeg -i "${INPUT_FILE}" -an -c:v copy "${INPUT_FILE}-noaud.mp4"'
install:
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
