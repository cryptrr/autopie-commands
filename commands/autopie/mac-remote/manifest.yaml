schemaVersion: "2026.6.1"
addedAt: "2026-11-12T08:16:16Z"
updatedAt: "2026-11-12T08:16:16Z"
version: "1.0.0"
id: "autopie.mac-remote"
namespace: "autopie"
name: "Mac Remote"
commandSlug: "openssh"
summary: "Control Music playback, adjust volume, open Safari, or sleep a Mac's display over SSH."
kind: "APP"
tags: ["openssh", "macos"]
runtime:
  type: "SHARE"
  path: ""
  command: |-
    mkdir -p "$HOME/.ssh"

    case "$ACTION" in
      previous)
        REMOTE="osascript -e 'tell application \"Music\" to previous track'"
        ;;
      play_pause)
        REMOTE="osascript -e 'tell application \"Music\" to playpause'"
        ;;
      next)
        REMOTE="osascript -e 'tell application \"Music\" to next track'"
        ;;
      volume_down)
        REMOTE="osascript -e 'set volume output volume ((output volume of (get volume settings)) - 10)'"
        ;;
      mute)
        REMOTE="osascript -e 'set volume output muted (not (output muted of (get volume settings)))'"
        ;;
      volume_up)
        REMOTE="osascript -e 'set volume output volume ((output volume of (get volume settings)) + 10)'"
        ;;
      safari)
        REMOTE="open -a Safari"
        ;;
      sleep_display)
        REMOTE="pmset displaysleepnow"
        ;;
      *)
        printf 'Unsupported action: %s\n' "$ACTION" >&2
        exit 2
        ;;
    esac

    SSH_TARGET="$MAC_USER@$MAC_HOST"
    SSH_OPTIONS=(
      -o ConnectTimeout=4
      -o StrictHostKeyChecking=accept-new
      -o ControlMaster=auto
      -o ControlPersist=10m
      -o ControlPath="$HOME/.ssh/autopie-%C"
    )

    case "$AUTH_METHOD" in
      password)
        if [ -z "$MAC_PASSWORD" ]; then
          printf 'The Mac password is required.\n' >&2
          exit 2
        fi

        SSHPASS="$MAC_PASSWORD" sshpass -e ssh \
          "${SSH_OPTIONS[@]}" \
          -o PubkeyAuthentication=no \
          -o PreferredAuthentications=password,keyboard-interactive \
          -o NumberOfPasswordPrompts=1 \
          "$SSH_TARGET" \
          "$REMOTE"
        ;;
      key)
        ssh \
          "${SSH_OPTIONS[@]}" \
          -o BatchMode=yes \
          "$SSH_TARGET" \
          "$REMOTE"
        ;;
      *)
        printf 'Unsupported authentication method: %s\n' "$AUTH_METHOD" >&2
        exit 2
        ;;
    esac
  extras:
    - id: "mac_user"
      name: "MAC_USER"
      type: "STRING"
      default: "amal"
      description: "Your macOS account username"
      required: true
      flags: ["--internal-config"]
    - id: "mac_host"
      name: "MAC_HOST"
      type: "STRING"
      default: "amals-mac-mini.lan"
      description: "Mac hostname or IP address"
      required: true
      flags: ["--internal-config"]
    - id: "auth_method"
      name: "AUTH_METHOD"
      type: "SELECTABLE"
      default: "password"
      description: "SSH authentication method"
      required: true
      flags: ["--internal-config"]
      selectableOptions:
        "Password": "password"
        "SSH key": "key"
    - id: "mac_password"
      name: "MAC_PASSWORD"
      type: "STRING"
      default: ""
      description: "macOS login password; encrypted by AutoPie"
      required: true
      flags: ["--password", "--large", "--internal-config"]
      visibleWhen:
        extraId: "auth_method"
        equals: "password"
    - id: "action"
      name: "ACTION"
      type: "BUTTON"
      default: "play_pause"
      description: "Control your Mac"
      required: true
      flags: ["--realtime", "--large"]
      selectableOptions:
        "⏮ Previous": "previous"
        "⏯ Play/Pause": "play_pause"
        "⏭ Next": "next"
        "🔉 Volume −": "volume_down"
        "🔇 Mute": "mute"
        "🔊 Volume +": "volume_up"
        "🌐 Safari": "safari"
        "🌙 Sleep Display": "sleep_display"
install:
  dependencies:
    pkg: ["openssh", "sshpass"]
  primaryPackage: "openssh"
  extraPackages: ["sshpass"]
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.19.0-beta"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
