version: "1.0.0"
id: "autopie.ffmpeg-convert-to-hevc"
namespace: "autopie"
name: "FFMPEG: Convert to HEVC"
commandSlug: "ffmpeg"
summary: "Transcode a video to an H.264 MP4 at CRF 24 using FFmpeg."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  path: ""
  command: 'ffmpeg -i "${INPUT_FILE}" -c:v libx264 -crf 24 -preset medium "${INPUT_FILE}-x265.mp4"'
install:
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
uninstall:
  script: "uninstall.sh"
