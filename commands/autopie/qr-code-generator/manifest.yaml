schemaVersion: "2026.6.1"
addedAt: "2026-11-13T11:47:47Z"
updatedAt: "2026-11-13T11:47:47Z"
version: "1.0.0"
id: "autopie.qr-code-generator"
namespace: "autopie"
name: "QR Code Generator"
commandSlug: "qrencode"
summary: "Generate a QR code PNG from shared text or a URL and display it in AutoPie's output viewer."
kind: "APP"
tags: ["qrencode", "qr", "image", "text", "url"]
runtime:
  path: "Download"
  type: "SHARE"
  flags: ["--show-loading-screen-small"]
  command: |-
    set +x
    set -u

    text="${INPUT_TEXT:-${INPUT_URL:-${INPUT:-}}}"
    if [ -z "$text" ]; then
      printf '%s\n' 'Share text or a URL to generate a QR code.' >&2
      exit 1
    fi

    image=$(mktemp "$(pwd -P)/qr-code-XXXXXXXX.png") || exit 1
    if ! printf '%s' "$text" | qrencode -t PNG -s 8 -o "$image"; then
      rm -f "$image"
      printf '%s\n' 'Could not generate a QR code. Try sharing less text.' >&2
      exit 1
    fi

    OUTPUT=$(jq -cn --arg path "$image" '{type:"image", path:$path}') || exit 1
    export OUTPUT

    app_component="${LOADING_ACTIVITY:-com.autopi/.LoadingActivity}"
    am start -n "${app_component%%/*}/.OutputPresentationActivity" \
      --es output "$OUTPUT" --es commandName "QR Code Generator" >/dev/null
install:
  dependencies:
    pkg: ["libqrencode", "coreutils", "jq"]
  primaryPackage: "libqrencode"
  extraPackages: ["coreutils", "jq"]
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
