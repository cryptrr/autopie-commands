schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.0"
id: "autopie.crop-video-to-mobile-dimensions"
namespace: "autopie"
name: "Crop Video to Mobile Dimensions"
commandSlug: "ffmpeg"
summary: "Crop a video to a configurable portrait aspect ratio while preserving its audio."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  type: "SHARE"
  path: ""
  command: "ffmpeg -i \"${INPUT_FILE}\" -vf \\\"crop=${WIDTH}/${HEIGHT}*in_h:in_h\\\" -c:a copy \"${INPUT_FILE}.cropped.mp4\""
  extras:
    - id: "551203"
      name: "WIDTH"
      type: "STRING"
      default: "9"
      description: "Width as aspect ratio"
      required: false
    - id: "657412"
      name: "HEIGHT"
      type: "STRING"
      default: "16"
      description: "Height as aspect ratio"
      required: false
install:
  dependencies:
    pkg: ["ffmpeg"]
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
