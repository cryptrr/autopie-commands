schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.0"
id: "autopie.rotate-video"
namespace: "autopie"
name: "Rotate Video"
commandSlug: "ffmpeg"
summary: "Rotate a video clockwise by 90, 180, or 270 degrees while preserving its audio."
kind: "APP"
tags: ["ffmpeg"]
runtime:
  type: "SHARE"
  path: ""
  command: "ffmpeg -i ${INPUT_FILE} -vf \"$( \\\n    case $ROTATE in \\\n        90) echo 'transpose=1';; \\\n        180) echo 'transpose=2,transpose=2';; \\\n        270) echo 'transpose=3';; \\\n    esac)\" -c:a copy ${INPUT_FILE}.rotated.mp4"
  extras:
    - id: "492563"
      name: "ROTATE"
      type: "SELECTABLE"
      default: "90"
      description: "Degrees to rotate (clockwise)"
      required: true
      selectableOptions: ["90", "180", "270"]
install:
  dependencies:
    pkg: ["ffmpeg"]
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
