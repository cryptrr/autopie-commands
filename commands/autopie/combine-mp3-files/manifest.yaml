schemaVersion: "2026.6.1"
addedAt: "2026-11-12T09:39:53Z"
updatedAt: "2026-11-12T09:39:53Z"
version: "1.0.0"
id: "autopie.combine-mp3-files"
namespace: "autopie"
name: "Combine MP3 files"
commandSlug: ""
summary: "Combine two or more shared MP3 files into one file without re-encoding."
kind: "APP"
tags: ["ffmpeg", "mp3"]
runtime:
  type: "SHARE"
  path: ""
  command: |-
    set -e
    if (( ${#INPUT_FILES_ARR[@]} < 2 )); then
      echo 'Share at least two MP3 files.' >&2
      exit 1
    fi
    list=$(mktemp)
    trap 'rm -f "$list"' EXIT
    for file in "${INPUT_FILES_ARR[@]}"; do
      [[ -f "$file" ]] || exit 1
      printf "file '%s'\n" "${file//\'/\'\\\'\'}" >> "$list"
    done
    first="${INPUT_FILES_ARR[0]}"
    name="${first##*/}"
    name="${name%.*}"
    output="$DIRECTORY/${name}-combined-$RANDOM.mp3"
    ffmpeg -hide_banner -loglevel error -n -f concat -safe 0 -i "$list" -c:a copy "$output"
    export OUTPUT="$output"
    printf 'Created: %s\n' "$output"
install:
  dependencies:
    pkg: ["ffmpeg"]
  primaryPackage: "ffmpeg"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
