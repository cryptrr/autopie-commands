addedAt: "2026-09-18T11:10:12Z"
updatedAt: "2026-09-18T11:10:12Z"
version: "1.0.0"
id: "autopie.epub-to-text"
namespace: "autopie"
name: "EPUB to Text"
commandSlug: ""
summary: "Extract an EPUB's reading-order content into a UTF-8 text file beside the book."
kind: "APP"
tags: ["python", "epub", "text", "ebook", "beautifulsoup"]
runtime:
  path: ""
  type: "SHARE"
  flags: ["--show-loading-screen-small"]
  command: |-
    #@PYTHON
    import json
    import os
    import posixpath
    import re
    import subprocess
    import sys
    import zipfile
    import xml.etree.ElementTree as ET
    from urllib.parse import unquote


    def ensure_bs4():
        try:
            from bs4 import BeautifulSoup
            return BeautifulSoup
        except ImportError:
            print("Installing BeautifulSoup...")
            subprocess.check_call([
                sys.executable,
                "-m",
                "pip",
                "install",
                "--disable-pip-version-check",
                "beautifulsoup4"
            ])
            from bs4 import BeautifulSoup
            return BeautifulSoup


    BeautifulSoup = ensure_bs4()

    input_file = os.environ.get("INPUT_FILE", "")

    if not input_file:
        raise SystemExit("No EPUB supplied")

    input_file = os.path.abspath(input_file)

    if not os.path.isfile(input_file):
        raise SystemExit(f"File not found: {input_file}")

    if not input_file.lower().endswith(".epub"):
        raise SystemExit("Input must be an EPUB file")

    output_file = os.path.splitext(input_file)[0] + ".txt"


    def local_name(tag):
        return tag.rsplit("}", 1)[-1]


    def find_package_file(z):
        root = ET.fromstring(z.read("META-INF/container.xml"))

        for node in root.iter():
            if local_name(node.tag) == "rootfile":
                path = node.attrib.get("full-path")
                if path:
                    return path

        raise RuntimeError("Could not locate EPUB package document")


    def parse_package(z, opf_path):
        root = ET.fromstring(z.read(opf_path))

        title = ""
        creator = ""
        manifest = {}
        spine_ids = []

        for node in root.iter():
            name = local_name(node.tag)

            if name == "title" and not title and node.text:
                title = node.text.strip()

            elif name == "creator" and not creator and node.text:
                creator = node.text.strip()

            elif name == "item":
                item_id = node.attrib.get("id")
                href = node.attrib.get("href")
                media_type = node.attrib.get("media-type", "")
                properties = node.attrib.get("properties", "")

                if item_id and href:
                    manifest[item_id] = {
                        "href": href,
                        "media_type": media_type,
                        "properties": properties.split()
                    }

            elif name == "itemref":
                item_id = node.attrib.get("idref")
                linear = node.attrib.get("linear", "yes").lower()

                if item_id and linear != "no":
                    spine_ids.append(item_id)

        base = posixpath.dirname(opf_path)
        documents = []

        for item_id in spine_ids:
            item = manifest.get(item_id)

            if not item:
                continue

            if item["media_type"] not in (
                "application/xhtml+xml",
                "text/html"
            ):
                continue

            if "nav" in item["properties"]:
                continue

            href = unquote(item["href"].split("#", 1)[0])
            path = posixpath.normpath(
                posixpath.join(base, href)
            )

            documents.append(path)

        return title, creator, documents


    def clean_text(content):
        soup = BeautifulSoup(content, "html.parser")

        for tag in soup([
            "script",
            "style",
            "svg",
            "noscript"
        ]):
            tag.decompose()

        root = soup.body or soup

        for br in root.find_all("br"):
            br.replace_with("\n")

        for li in root.find_all("li"):
            li.insert(0, "• ")

        block_tags = [
            "p", "div", "section", "article",
            "blockquote", "pre",
            "h1", "h2", "h3", "h4", "h5", "h6",
            "li", "ul", "ol",
            "table", "tr", "td", "th",
            "figure", "figcaption"
        ]

        for tag in root.find_all(block_tags):
            tag.append("\n")

        raw = root.get_text(separator=" ", strip=False)
        raw = raw.replace("\u00a0", " ")

        lines = []

        for line in raw.splitlines():
            line = re.sub(r"[ \t]+", " ", line).strip()

            if line:
                lines.append(line)
            elif lines and lines[-1] != "":
                lines.append("")

        text = "\n".join(lines)
        text = re.sub(r"\n{3,}", "\n\n", text)

        return text.strip()


    print(f"Reading: {input_file}")

    with zipfile.ZipFile(input_file, "r") as z:
        names = set(z.namelist())

        opf_path = find_package_file(z)
        title, creator, documents = parse_package(z, opf_path)

        # Fallback for broken EPUBs without a useful spine.
        if not documents:
            documents = sorted(
                name for name in names
                if name.lower().endswith(
                    (".xhtml", ".html", ".htm")
                )
            )

        sections = []

        for path in documents:
            if path not in names:
                continue

            try:
                text = clean_text(z.read(path))
            except Exception as exc:
                print(f"Skipping {path}: {exc}")
                continue

            if text:
                sections.append(text)

    if not sections:
        raise SystemExit("No readable text found")

    parts = []

    if title:
        parts.append(title)

    if creator:
        parts.append("By " + creator)

    parts.extend(sections)

    final_text = "\n\n".join(parts).strip() + "\n"

    with open(output_file, "w", encoding="utf-8") as f:
        f.write(final_text)

    result = {
        "file": output_file,
        "sections": len(sections),
        "characters": len(final_text)
    }

    print(f"Extracted {len(sections)} sections")
    print(f"Saved to: {output_file}")

    print(
        "#@AUTOPIE " +
        json.dumps({
            "type": "output",
            "value": result
        }, ensure_ascii=False)
    )
install:
  dependencies:
    pkg: ["python"]
    pip: ["beautifulsoup4"]
  primaryPackage: "python"
  extraPackages: ["beautifulsoup4"]
  installerVersion: 1
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
