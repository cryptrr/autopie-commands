schemaVersion: "2026.6.1"
addedAt: "2026-11-13T11:33:34Z"
updatedAt: "2026-11-13T11:33:34Z"
version: "1.0.0"
id: "autopie.hash-generator"
namespace: "autopie"
name: "Hash Generator"
commandSlug: "python"
summary: "Generate one or more hashes for a shared file, shared text, or text you enter."
kind: "APP"
tags: ["python", "hash", "checksum"]
runtime:
  multiStage: true
  type: "SHARE"
  flags: ["--show-loading-screen-small"]
  steps:
    - id: "detect_input"
      command: |-
        if [ -n "${INPUT:-}" ]; then
          export INPUT_PRESENT="yes"
        else
          export INPUT_PRESENT="no"
        fi
    - id: "hash"
      command: |-
        set -e
        OUTPUT="$(python - <<'PYHASH'
        import hashlib
        import json
        import os
        import sys

        algorithms = {
            "md5": "MD5",
            "sha1": "SHA-1",
            "sha256": "SHA-256",
            "sha512": "SHA-512",
            "sha3_256": "SHA3-256",
            "blake2b": "BLAKE2b",
        }
        choice = os.environ.get("HASH_ALGORITHM", "all") or "all"
        if choice not in ("all", *algorithms):
            sys.exit("Unsupported hash algorithm: " + choice)

        active_input = os.environ.get("INPUT", "")
        input_file = os.environ.get("INPUT_FILE", "")
        path = input_file if input_file and os.path.isfile(input_file) else (
            active_input if active_input and os.path.isfile(active_input) else None
        )
        selected = algorithms if choice == "all" else {choice: algorithms[choice]}
        hashers = {name: hashlib.new(name) for name in selected}

        if path:
            with open(path, "rb") as source:
                for block in iter(lambda: source.read(1024 * 1024), b""):
                    for hasher in hashers.values():
                        hasher.update(block)
            title = "File hashes: " + os.path.basename(path)
        else:
            text = (os.environ.get("INPUT_TEXT") or active_input) if active_input else os.environ.get("DATA", "")
            if not text:
                sys.exit("Share text or a file, or enter text to hash.")
            data = text.encode("utf-8")
            for hasher in hashers.values():
                hasher.update(data)
            title = "Text hashes (UTF-8)"

        digests = {name: hasher.hexdigest() for name, hasher in hashers.items()}
        items = [
            {"type": "text", "text": label + "\n" + digests[name]}
            for name, label in selected.items()
        ]
        expected_hash = os.environ.get("EXPECTED_HASH", "").strip().lower()
        if choice != "all" and expected_hash:
            matches = digests[choice] == expected_hash
            items.append({"type": "text", "text": "Match: " + ("true" if matches else "false")})

        output = {"type": "list", "title": title, "items": items}
        print(json.dumps(output, ensure_ascii=False, separators=(",", ":")))
        PYHASH
        )"
        export OUTPUT
        am start -n com.autopi/.OutputPresentationActivity --es output "$OUTPUT" >/dev/null
      extras:
        - id: "hash_algorithm"
          name: "HASH_ALGORITHM"
          type: "SELECTABLE"
          default: "all"
          description: "Generate all hashes or select one algorithm."
          selectableOptions:
            "All": "all"
            "MD5": "md5"
            "SHA-1": "sha1"
            "SHA-256": "sha256"
            "SHA-512": "sha512"
            "SHA3-256": "sha3_256"
            "BLAKE2b": "blake2b"
        - id: "expected_hash"
          name: "EXPECTED_HASH"
          type: "STRING"
          default: ""
          description: "Paste an expected hash to compare with the generated hash (optional)."
          required: false
          visibleWhen:
            extraId: "hash_algorithm"
            notEquals: "all"
            isEmpty: false
        - id: "input_present"
          name: "INPUT_PRESENT"
          type: "STRING"
          default: "$$INPUT_PRESENT"
          flags: ["--internal-config"]
          description: "Internal flag reflecting whether data was shared."
        - id: "data"
          name: "DATA"
          type: "STRING"
          default: ""
          description: "Text to hash when no input was shared."
          required: false
          flags: ["--multiline"]
          visibleWhen:
            extraId: "input_present"
            equals: "no"
      flags: ["--show-loading-screen-small"]
install:
  dependencies:
    pkg: ["python"]
  primaryPackage: "python"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
