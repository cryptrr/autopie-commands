schemaVersion: "2026.6.1"
addedAt: "2026-07-14T11:24:14Z"
updatedAt: "2026-07-14T11:24:14Z"
version: "1.0.0"
id: "autopie.remove-image-borders"
namespace: "autopie"
name: "Remove Image Borders"
commandSlug: "magick"
summary: "Automatically trim uniform borders from an image with configurable color tolerance."
kind: "APP"
tags: ["imagemagick"]
runtime:
  type: "SHARE"
  path: ""
  command: 'magick "${INPUT_FILE}" -fuzz ${FUZZ}% -trim "${INPUT_FILE}-trim.jpg"'
  extras:
    - id: "131124"
      name: "FUZZ"
      type: "STRING"
      default: "50"
      description: ""
      required: true
install:
  primaryPackage: "imagemagick"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
uninstall:
  script: "uninstall.sh"
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: "0.x"
status: "stable"
maintainers: ["cryptrr"]
