schemaVersion: "2026.6.1"
addedAt: "2026-11-23T06:38:49Z"
updatedAt: "2026-11-23T06:38:49Z"
version: "1.0.0"
id: "autopie.pdf-to-text"
namespace: "autopie"
name: "PDF to Text"
commandSlug: "pdftotext"
summary: "Extract embedded PDF text into a UTF-8 file beside the PDF, with optional layout preservation."
kind: "APP"
tags: ["poppler", "pdf", "text"]
runtime:
  type: "SHARE"
  path: ""
  flags: ["--show-loading-screen-small"]
  command: |-
    set -e
    src="$INPUT_FILE"
    if [[ -z "$src" || ! -f "$src" ]]; then
      echo "Share or select a PDF file in AutoPie."
      exit 1
    fi
    if [[ "${src,,}" != *.pdf ]]; then
      echo "The selected file is not a PDF."
      exit 1
    fi
    if ! command -v pdftotext >/dev/null 2>&1; then
      echo "Missing Poppler. Install with: pkg install poppler"
      exit 1
    fi

    dir="$(dirname -- "$src")"
    file="$(basename -- "$src")"
    stem="${file%.*}"
    out="$dir/$stem.txt"
    if [[ -e "$out" ]]; then
      out="$dir/$stem-$RAND.txt"
    fi

    args=(-enc UTF-8 -nopgbrk)
    if [[ "$LAYOUT" == "preserve" ]]; then
      args+=(-layout)
    fi
    if ! pdftotext "${args[@]}" "$src" "$out"; then
      rm -f -- "$out"
      echo "PDF text extraction failed."
      exit 1
    fi
    if [[ ! -s "$out" ]]; then
      rm -f -- "$out"
      echo "No embedded text found. Scanned PDFs require OCR."
      exit 1
    fi
    export OUTPUT="$out"
    printf 'Saved: %s\n\nText preview (first 80 lines):\n' "$out"
    sed -n '1,80p' "$out"
  extras:
    - id: "layout"
      name: "LAYOUT"
      type: "SELECTABLE"
      default: "reading"
      defaultBoolean: true
      description: "Text extraction mode"
      required: true
      selectableOptions:
        "Reading order": "reading"
        "Preserve layout": "preserve"
install:
  dependencies:
    pkg: ["poppler"]
  primaryPackage: "poppler"
  extraPackages: []
  installerVersion: 1
  script: "install.sh"
  sha256: "..."
docs:
  readme: "README.md"
  changelog: "CHANGELOG.md"
compatibility:
  autopieMinVersion: "0.x"
  autopieMaxVersion: null
status: "stable"
maintainers: ["cryptrr"]
